# People: the ones The AI talks to. Fictional composites, never real users, transcripts or identifiable details
# (spec v2 §10). ALL DRAFT.
#
# A zoomed person = a place + a name common there + an age + one "today" line (what they're asking, with The AI's
# first line back) + one detail. Their local time comes from the place's UTC offset at the moment of the zoom.
#
#   places:      real cities; utc_offset_minutes is standard time (daylight saving is ignored for now);
#                lat/lon place their light on the world map
#   name:        needs `place`: a first name common there. [VERIFY] against national name statistics
#   today:       applies_to occupations; `reply` is The AI's first line back, plain and kind
#   details:     worry | food | pleasure | weather, for anyone
#
# Care (spec v2 §1, §10): people bring grief, exams, money, loneliness. Write them with dignity; no crisis content as
# spectacle; nothing that reads as advice to a real person in danger. The AI can be warm, never claims feelings.

