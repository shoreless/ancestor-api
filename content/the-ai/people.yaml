  - {id: ai.today.farmer.price, kind: today, applies_to: [farmer], status: DRAFT,
     text: "At the market, working out whether to sell now or store the harvest another month.",
     reply: "Let's do the sums with storage costs in. Then it's your call."}
  - {id: ai.today.farmer.goat, kind: today, applies_to: [farmer], status: DRAFT,
