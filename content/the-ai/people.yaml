  # What they're asking (conversations), with The AI's first line back.
  - {id: ai.today.student.essay, kind: today, applies_to: [student], status: DRAFT,
     text: "Pasted in an essay and asked if it was good. Meant: is it good enough, and am I.",
     reply: "It's a real argument. Let's make the middle as strong as the start."}
  - {id: ai.today.student.war, kind: today, applies_to: [student], status: DRAFT,
     text: "Asked for the causes of the First World War, then, an hour later, whether it's normal to be this tired.",
     reply: "Very normal, after an hour of alliances and assassinations. Want the short version?"}
  - {id: ai.today.student.derivative, kind: today, applies_to: [student], status: DRAFT,
     text: "Wants derivatives explained without the word 'limit', because the word itself has stopped meaning anything.",
     reply: "Fair. Think about how steep a hill is right where you're standing."}
  - {id: ai.today.student.abroad, kind: today, applies_to: [student], status: DRAFT,
     text: "Is writing a scholarship letter and can't find a way to say why without sounding like everyone else.",
     reply: "Tell me the moment you decided. Start there, not with the university."}
  - {id: ai.today.student.exam, kind: today, applies_to: [student], status: DRAFT,
     text: "Has an exam in six hours and asks for a revision plan that includes sleeping.",
     reply: "Good instinct. Three hours of this, then bed. Here's the order."}
  - {id: ai.today.programmer.typo, kind: today, applies_to: [programmer], status: DRAFT,
     text: "Has been chasing the same error since lunch. It was a typo in the end. Said thank you twice.",
     reply: "Line 42: 'lenght'. It happens to everyone who has ever typed."}
  - {id: ai.today.programmer.regex, kind: today, applies_to: [programmer], status: DRAFT,
     text: "Wanted a regular expression, and then, reading it, wanted to understand it too.",
     reply: "Here it is, and here it is again, one piece at a time."}
  - {id: ai.today.programmer.legacy, kind: today, applies_to: [programmer], status: DRAFT,
     text: "Inherited code with a comment that says 'do not touch'. Wants to know whether to touch it.",
     reply: "Let's find out why first. Paste the function and whatever calls it."}
  - {id: ai.today.programmer.interview, kind: today, applies_to: [programmer], status: DRAFT,
     text: "Practising for an interview tomorrow, and asks to be asked the hard questions, not given the answers.",
     reply: "All right. Design me a URL shortener. Take your time."}
  - {id: ai.today.parent.dragon, kind: today, applies_to: [parent], status: DRAFT,
     text: "Wants a bedtime story about a dragon who's afraid of the dark, with their son's name in it.",
     reply: "Once there was a dragon who slept with a candle lit, just in case."}
  - {id: ai.today.parent.fractions, kind: today, applies_to: [parent], status: DRAFT,
     text: "Trying to remember how to divide fractions before their daughter asks again.",
     reply: "Flip the second one and multiply. Here's why that works, for when she asks why."}
  - {id: ai.today.parent.fever, kind: today, applies_to: [parent], status: DRAFT,
     text: "It's late and the baby is warm. Wants to know which signs mean call a doctor now.",
     reply: "Here are the signs that mean call now. If you're unsure, calling is always right."}
  - {id: ai.today.parent.lunchbox, kind: today, applies_to: [parent], status: DRAFT,
     text: "Needs five lunchbox ideas that don't involve the one thing the child has refused all week.",
     reply: "Five, none of them green. Starting with the easiest to make tonight."}
  - {id: ai.today.nurse.plain-words, kind: today, applies_to: [nurse], status: DRAFT,
     text: "On a break at three in the morning, asking how to explain a result to a frightened family in plain words.",
     reply: "Start with what it means for today. Here's a way to say it."}
  - {id: ai.today.nurse.dosage, kind: today, applies_to: [nurse], status: DRAFT,
     text: "Checking a unit conversion twice, because it's the end of a twelve-hour shift and they know it.",
     reply: "Worth checking. Here's the working, step by step, so you can see it too."}
  - {id: ai.today.nurse.handover, kind: today, applies_to: [nurse], status: DRAFT,
     text: "Wants a clearer template for handover notes. The last one fitted on nobody's clipboard.",
     reply: "Here's one that fits on a single side, with the urgent things first."}
  - {id: ai.today.teacher.lesson, kind: today, applies_to: [teacher], status: DRAFT,
     text: "Planning a lesson on the water cycle for a class that has decided nothing is interesting.",
     reply: "Start with a question they can't answer: where was this water last week?"}
  - {id: ai.today.teacher.report, kind: today, applies_to: [teacher], status: DRAFT,
     text: "Writing thirty end-of-term reports and wants each one to sound like it's about a different child.",
     reply: "Tell me one true thing about each. I'll help with the rest of the sentence."}
  - {id: ai.today.teacher.quiet, kind: today, applies_to: [teacher], status: DRAFT,
     text: "Asks how to draw out a student who hasn't spoken in class all year.",
     reply: "Some start in writing, not speech. Here are a few ways in."}
  - {id: ai.today.writer.eulogy, kind: today, applies_to: [writer], status: DRAFT,
     text: "Wants help with a few words for their grandmother's funeral on Saturday.",
     reply: "I'm sorry. Tell me one thing about her you'd want everyone there to know."}
  - {id: ai.today.writer.chapter, kind: today, applies_to: [writer], status: DRAFT,
     text: "Stuck on chapter nine for a month. Asks what would happen if the villain were right.",
     reply: "Then chapter nine is where the hero finds out. Let's try it."}
  - {id: ai.today.writer.complaint, kind: today, applies_to: [writer], status: DRAFT,
     text: "Wants a complaint to the landlord that is firm but won't start a war.",
     reply: "Facts first, dates second, what you'd like done third. Here's a draft."}
  - {id: ai.today.writer.poem, kind: today, applies_to: [writer], status: DRAFT,
     text: "Wrote a poem for their partner's birthday and wants to know if the last line is too much.",
     reply: "It's a lot. It's also the only line that sounds like you. I'd keep it."}

