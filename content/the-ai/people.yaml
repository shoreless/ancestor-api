# People: the ones the AI talks to. Composites, never real users or real conversations. ALL DRAFT.
# A zoomed person = one name + an age in the occupation's range + one "today" line + one detail.

occupations:
  - {id: student, name: Student, age: [13, 30]}
  - {id: programmer, name: Programmer, age: [18, 65]}
  - {id: night-nurse, name: Nurse on nights, age: [22, 64]}
  - {id: parent, name: Parent, age: [20, 60]}
  - {id: shopkeeper, name: Shopkeeper, age: [20, 75]}
  - {id: retiree, name: Retiree, age: [60, 92]}
  - {id: commuter, name: Commuter, age: [18, 66]}

fragments:
  - {id: ai.name.amara, kind: name, text: Amara, status: DRAFT}
  - {id: ai.name.tomasz, kind: name, text: Tomasz, status: DRAFT}
  - {id: ai.name.priya, kind: name, text: Priya, status: DRAFT}
  - {id: ai.name.kenji, kind: name, text: Kenji, status: DRAFT}
  - {id: ai.name.lucia, kind: name, text: Lucía, status: DRAFT}
  - {id: ai.name.samir, kind: name, text: Samir, status: DRAFT}
  - {id: ai.name.grace, kind: name, text: Grace, status: DRAFT}
  - {id: ai.name.oluwaseun, kind: name, text: Oluwaseun, status: DRAFT}

  - {id: ai.today.student.essay, kind: today, applies_to: [student], status: DRAFT,
     text: "Pasted in an essay and asked if it was good. Meant: is it good enough, and am I."}
  - {id: ai.today.student.war, kind: today, applies_to: [student], status: DRAFT,
     text: "Asked for the causes of the First World War, then, an hour later, whether it's normal to be this tired."}
