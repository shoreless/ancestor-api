     text: "Has been chasing the same error since lunch. It was a typo in the end. Said thank you twice."}
  - {id: ai.today.programmer.regex, kind: today, applies_to: [programmer], status: DRAFT,
     text: "Wanted a regular expression, and then, reading it, wanted to understand it too."}
  - {id: ai.today.nurse.plain-words, kind: today, applies_to: [night-nurse], status: DRAFT,
     text: "On a break at three in the morning, asking how to explain a result to a frightened family in plain words."}
  - {id: ai.today.parent.dragon, kind: today, applies_to: [parent], status: DRAFT,
     text: "Wants a bedtime story about a dragon who's afraid of the dark, with the child's name in it."}
  - {id: ai.today.parent.fractions, kind: today, applies_to: [parent], status: DRAFT,
     text: "Trying to remember how to divide fractions before their daughter asks again."}
  - {id: ai.today.shopkeeper.sign, kind: today, applies_to: [shopkeeper], status: DRAFT,
