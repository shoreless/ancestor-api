# Era pack: Kaifeng, c. 1120 (Northern Song capital). ALL DRAFT.
# The generator logic is dreamlike; the people inside each tier must be accurate.
#
# Numbers are balance starting points. Big values may be written as numbers or strings ("2.5e5").
#   cost_growth:     cost multiplier per unit BOUGHT (produced units don't raise the price)
#   unlock_at:       count of the tier below that wakes this tier
#   people:          occupation ids (people.yaml) a zoom into this tier can resolve

id: era-kaifeng-1120
kind: era
title: Kaifeng
subtitle: Northern Song capital, c. 1120
status: DRAFT
naming_source: {source: dmhl, locator: "[VERIFY] naming conventions for commoners"}

currency:
  id: cash
  name: copper cash
  note: "[VERIFY] strings of copper cash: denominations and plausible earnings per occupation"

attention_per_second: 0.8

# The room description under the scene, Infocom-style. {generator-id} becomes that tier's current count.
look: >-
  [DRAFT] Dusk. {street-hawkers} hawkers cry their wares below the Iron Pagoda. {market-stalls} stalls
  have their awnings up, and a barge noses toward the wharf.

start:
  cash: 10
  attention: 5
  generators: {street-hawkers: 1}

generators:
  - id: street-hawkers
    tier: 1
    name: Street hawkers
    base_cost: 5
    attention_cost: 1
    cost_growth: 1.08
    cycle_seconds: 1.0
    output_per_unit: 1
    people: [hawker]

  - id: market-stalls
    tier: 2
    name: Market stalls
    base_cost: 60
    attention_cost: 3
    cost_growth: 1.10
    cycle_seconds: 3.0
    output_per_unit: 1
    unlock_at: 10
    people: [stallholder]

  - id: canal-wharves
    tier: 3
    name: Canal wharves
    base_cost: 4000
    attention_cost: 8
    cost_growth: 1.12
    cycle_seconds: 8.0
    output_per_unit: 1
    unlock_at: 10
    people: [porter, boatman]

  - id: night-markets
    tier: 4
    name: Night markets
    base_cost: 2.5e5
    attention_cost: 20
    cost_growth: 1.15
    cycle_seconds: 20.0
    output_per_unit: 1
    unlock_at: 25
    people: [night-crowd]

# Mission types:
#   own (generator, amount) · collect (amount of currency since rank start) · zoom (amount of distinct people)
#   level_subagent (subagent or "any", amount = level) · spot_glitch (amount) · open_capsules (amount)
#   automate (generator)
# Ranks 1–3: required == available. From rank 4: available == required + 3, so slow missions can be skipped.
# guarantees: subagents the rank-up capsule always contains, so no required mission waits on luck
#   (rank 2 levels a subagent and rank 3 automates hawkers, so the first card comes at rank 1).

max_active_missions: 3

ranks:
  - rank: 1
    required: 3
    guarantees: [sesame-cake-seller]
    story: >-
      [DRAFT] Fog, and then a street. The fog does not lift so much as agree, stall by stall, to be a market.
    missions:
      - {id: r1-own-hawkers, type: own, generator: street-hawkers, amount: 10}
      - {id: r1-collect, type: collect, amount: 500}
      - {id: r1-zoom, type: zoom, amount: 1}

  - rank: 2
    required: 4
    story: >-
      [DRAFT] Before dawn, a voice calls the price of cakes. The mind, not quite asleep, answers it.
    missions:
      - {id: r2-own-stalls, type: own, generator: market-stalls, amount: 5}
      - {id: r2-collect, type: collect, amount: 5000}
      - {id: r2-level, type: level_subagent, subagent: any, amount: 2}
      - {id: r2-zoom, type: zoom, amount: 3}

  - rank: 3
    required: 5
    guarantees: [tea-house-server]
    story: >-
      [DRAFT] The canal is brown and slow and full of boats. The mind has the feeling, faint and specific,
      of having stood on this bank before.
    missions:
      - {id: r3-own-wharves, type: own, generator: canal-wharves, amount: 3}
      - {id: r3-automate, type: automate, generator: street-hawkers}
      - {id: r3-collect, type: collect, amount: 5.0e4}
      - {id: r3-glitch, type: spot_glitch, amount: 1}
      - {id: r3-capsules, type: open_capsules, amount: 3}

  - rank: 4
    required: 5
    story: >-
      [DRAFT] Lanterns come on down the length of the street. Someone calls a name the mind almost knows.
    missions:
      - {id: r4-own-night, type: own, generator: night-markets, amount: 1}
      - {id: r4-collect, type: collect, amount: 1.0e6}
      - {id: r4-zoom, type: zoom, amount: 10}
      - {id: r4-level, type: level_subagent, subagent: any, amount: 4}
      - {id: r4-own-stalls, type: own, generator: market-stalls, amount: 50}
      - {id: r4-automate, type: automate, generator: canal-wharves}
      - {id: r4-glitch, type: spot_glitch, amount: 2}
      - {id: r4-capsules, type: open_capsules, amount: 5}

  - rank: 5
    required: 6
    story: >-
      [DRAFT] The market thins toward morning. The mind feels itself surfacing, or something like it.
    missions:
      - {id: r5-own-wharves, type: own, generator: canal-wharves, amount: 50}
      - {id: r5-collect, type: collect, amount: 1.0e8}
      - {id: r5-glitch, type: spot_glitch, amount: 3}
      - {id: r5-level-server, type: level_subagent, subagent: tea-house-server, amount: 3}
      - {id: r5-zoom, type: zoom, amount: 20}
      - {id: r5-own-night, type: own, generator: night-markets, amount: 10}
      - {id: r5-own-hawkers, type: own, generator: street-hawkers, amount: 500}
      - {id: r5-capsules, type: open_capsules, amount: 8}
      - {id: r5-level-any, type: level_subagent, subagent: any, amount: 5}

migrations: []
