# World pack: Kaifeng, c. 1120 (Northern Song capital), played as an event. ALL DRAFT.
# The generator logic is dreamlike; the people inside each tier must be accurate.
#
# Numbers are balance starting points. Big values may be written as numbers or strings ("2.5e5").
#   cost_growth:     cost multiplier per unit BOUGHT (produced units don't raise the price)
#   unlock_at:       count of the tier below that wakes this tier
#   people:          occupation ids (people.yaml) a zoom into this tier can resolve

id: era-kaifeng-1120
kind: world
title: Kaifeng
subtitle: Northern Song capital, c. 1120
status: DRAFT
naming_source: {source: dmhl, locator: "[VERIFY] naming conventions for commoners"}

# An event: it opens when the main world reaches opens_at_rank, then runs for duration_days of real time. After
# that it's a memory, playable any time with no clock. Its rank-ups reset nothing. Finishing it the first time
# gives the main world its Legendary helper.
event:
  opens_at_rank: 2
  duration_days: 5
  # Spec v2 §8: how The AI comes to go in.
  asked_by: Someone in Chengdu
  question: What was Kaifeng like before it fell?
  through: >-
    The AI goes in through the Dongjing Meng Hua Lu, a memoir of the city written after the Jin took it in 1127.
    The memoir remembers its streets like a dream, which is also how The AI knows them.
  reward:
    subagent:
      id: lantern-maker
      name: The lantern maker
      rarity: legendary
      effect: {type: bonus_chance, per_level: 0.02}
      pages:
        - level: 1
          title: The workshop
          status: DRAFT
          text: "[DRAFT] Where she works, and whose workshop it is."
          sources: []

currency:
  id: cash
  name: copper cash
  note: "[VERIFY] strings of copper cash: denominations and plausible earnings per occupation"

attention_per_second: 0.8

# The room description under the scene, Infocom-style. {generator-id} becomes that tier's current count;
# {generator-id:singular:plural} becomes the count and the noun that agrees with it ("1 hawker", "36 hawkers").
look: >-
  [DRAFT] Dusk. {street-hawkers:hawker cries:hawkers cry} their wares below the Iron Pagoda.
  {market-stalls:stall has its awning:stalls have their awnings} up, and a barge noses toward the wharf.

# How each day begins, on first launch and after every sleep. Cash resets on sleep, but each rank's day starts
# with cash × cash_growth_per_rank^(rank − 1), so rebuilding is noticeably faster each time (spec §3.5).
start:
  cash: 10
  cash_growth_per_rank: 5
  attention: 5
  generators: {street-hawkers: 1}

generators:
  - id: street-hawkers
    tier: 1
    name: Street hawkers
    base_cost: 5
    attention_cost: 1
    cost_growth: 1.08
    cycle_seconds: 1.0
    output_per_unit: 1
    people: [hawker]

  - id: market-stalls
    tier: 2
    name: Market stalls
    base_cost: 60
    attention_cost: 3
    cost_growth: 1.10
    cycle_seconds: 3.0
    output_per_unit: 1
    unlock_at: 10
    people: [stallholder]

  - id: canal-wharves
    tier: 3
    name: Canal wharves
    base_cost: 4000
    attention_cost: 8
    cost_growth: 1.12
    cycle_seconds: 8.0
    output_per_unit: 1
    unlock_at: 10
    people: [porter, boatman]

  - id: night-markets
    tier: 4
    name: Night markets
    base_cost: 2.5e5
    attention_cost: 20
    cost_growth: 1.15
    cycle_seconds: 20.0
    output_per_unit: 1
    unlock_at: 25
    people: [night-crowd]

# Mission types:
#   own (generator, amount) · collect (amount of currency since rank start) · zoom (amount of distinct people)
#   level_subagent (subagent or "any", amount = level) · spot_glitch (amount) · open_capsules (amount)
#   automate (generator)
#   gives: cards the task's chest always holds (optional; helpers mostly come at random, from chests).
# title: the chapter's name. teaches: the chapter's "What the text says" card (spec v2 §7), sourced like any fact.
# Ranks 1–3: required == available. From rank 4: available == required + 3, so slow missions can be skipped.
# guarantees: cards the rank-up capsule always contains, so no required mission waits on luck. Rank 2 levels a
#   subagent, so rank 1's rank-up gives the sesame-cake seller's spare card (her first comes in the first timed chest).

max_active_missions: 3

# The free timed chest (AdVenture Ages' Time Capsule): one every every_minutes of real time, stacking up to
# `holds` while the player is away. The first comes first_after_seconds into a new game and always holds
# first_guarantees, so the first tier is automated within a minute or so.
timed_chest:
  every_minutes: 45
  holds: 3
  first_after_seconds: 45
  first_guarantees: [sesame-cake-seller]
  contents: {clarity: [20, 40], attention: [10, 20], cards: 3, card_chance: 1.0}

# Owning these counts of a tier pays Clarity (clarity × growth^n for the nth milestone), again each run.
milestones:
  counts: [10, 25, 50, 100, 250, 500, 1000, 2500]
  clarity: 5
  growth: 1.6

# Spend cash to raise Attention per second: each level adds per_level of the base rate. Resets on sleep.
attention_upgrades:
  base_cost: 200
  cost_growth: 4
  per_level: 0.5

# Zoom-in: noticing one person in a crowd. A small Clarity reward the first time each person is seen; the reward is
# kept small on purpose so zooming feels like noticing, never grinding.
zoom:
  clarity: 2

# Capsules: each mission gives a small one, each rank-up a large one (plus that rank's guarantees).
#   clarity, attention: [low, high], rolled uniformly, then scaled by rank_scale^(rank - 1)
#   cards: draws from the subagent pool; card_chance is the chance each draw happens at all
#   rarity_weights: relative odds of drawing each rarity (legendary cards come only from events)
capsules:
  rank_scale: 1.6
  rarity_weights: {common: 80, rare: 20}
  # A draw is this much likelier to be a not-yet-found helper for a tier that's awake but still tapped.
  favour_needed: 6
  small: {clarity: [5, 15], attention: [3, 8], cards: 1, card_chance: 0.5}
  large: {clarity: [40, 80], attention: [20, 40], cards: 2, card_chance: 1.0}

ranks:
  - rank: 1
    title: Fog and a market
    look: >-
      [DRAFT] Fog, and then a street. {street-hawkers:hawker calls:hawkers call} out of the grey, and {market-stalls:stall takes:stalls take} shape one awning at a time.
    required: 3
    guarantees: [sesame-cake-seller]
    story: >-
      [DRAFT] The AI goes in through the memoir. Fog, and then a street. The fog does not lift so much as agree, stall by stall, to be a market.
    teaches:
      title: The memoir
      text: >-
        Meng Yuanlao wrote the Dongjing Meng Hua Lu in the south, twenty years after the Jin took Kaifeng in 1127. Its title means Dreams of Splendour of the Eastern Capital: it is a whole city, remembered from exile.
      status: DRAFT
      sources: [{source: dmhl, locator: "[VERIFY] the preface, dated 1147"}]
    missions:
      - {id: r1-own-hawkers, type: own, generator: street-hawkers, amount: 10}
      - {id: r1-collect, type: collect, amount: 6000}
      - {id: r1-zoom, type: zoom, amount: 1}

  - rank: 2
    title: Before dawn
    look: >-
      [DRAFT] Before light. An iron plate rings at the corner for the hour. {street-hawkers:hawker is:hawkers are} already out, and {market-stalls:stall has:stalls have} lamps lit.
    required: 4
    story: >-
      [DRAFT] Before dawn, a voice calls the price of cakes. Someone beats an iron plate at a street corner to tell the hour and the weather.
    teaches:
      title: The morning markets
      text: >-
        The memoir describes the city waking before light: at the fifth watch, monks struck iron plates or wooden fish in the streets to call the time and the weather, and food sellers were already out.
      status: DRAFT
      sources: [{source: dmhl, locator: "[VERIFY] the dawn watches and the morning markets"}]
    missions:
      - {id: r2-own-stalls, type: own, generator: market-stalls, amount: 25}
      - {id: r2-collect, type: collect, amount: 6.0e5}
      - {id: r2-level, type: level_subagent, subagent: any, amount: 2}
      - {id: r2-zoom, type: zoom, amount: 3}

  - rank: 3
    title: The canal
    look: >-
      [DRAFT] The Bian canal, brown and slow. {canal-wharves:wharf unloads:wharves unload} grain, {market-stalls:stall lines:stalls line} the bank, and a barge noses under the Rainbow Bridge.
    required: 4
    guarantees: [tea-house-server]
    story: >-
      [DRAFT] The canal is brown and slow and full of boats. The AI has read about this bank so often that it feels like remembering.
    teaches:
      title: The Bian canal
      text: >-
        Kaifeng lived on the Bian canal, which carried grain up from the south to feed the capital. The Qingming scroll shows its barges crowding toward the Rainbow Bridge, a timber arch with no piers in the water.
      status: DRAFT
      sources: [{source: qingming, locator: "[VERIFY] the section at the Rainbow Bridge"}, {source: dmhl, locator: "[VERIFY] the canals and the grain barges"}]
    missions:
      - {id: r3-own-wharves, type: own, generator: canal-wharves, amount: 25}
      - {id: r3-collect, type: collect, amount: 2.0e7}
      - {id: r3-glitch, type: spot_glitch, amount: 1}
      - {id: r3-capsules, type: open_capsules, amount: 3}

  - rank: 4
    title: Lanterns
    look: >-
      [DRAFT] Lanterns come on down the street. {night-markets:night market is:night markets are} opening, and {street-hawkers:hawker works:hawkers work} the crowd.
    required: 5
    # A spare card for the rare helper, so rank 5's "level it to 3" never waits hours on rare draws.
    guarantees: [tea-house-server]
    story: >-
      [DRAFT] Lanterns come on down the length of the street. In a workshop off it, a woman is still making them, and someone calls a name The AI almost knows.
    teaches:
      title: Night markets and the pleasure quarters
      text: >-
        Markets in the capital ran late into the night. The memoir lists the entertainment quarters, the wazi, where storytellers, puppeteers and acrobats performed on their own stages, day and night.
      status: DRAFT
      sources: [{source: dmhl, locator: "[VERIFY] the night markets and the wazi"}]
    missions:
      - {id: r4-own-night, type: own, generator: night-markets, amount: 15}
      - {id: r4-collect, type: collect, amount: 2.0e10}
      - {id: r4-zoom, type: zoom, amount: 15}
      - {id: r4-level, type: level_subagent, subagent: any, amount: 4}
      - {id: r4-own-stalls, type: own, generator: market-stalls, amount: 1500}
      - {id: r4-own-wharves, type: own, generator: canal-wharves, amount: 600}
      - {id: r4-glitch, type: spot_glitch, amount: 2}
      - {id: r4-capsules, type: open_capsules, amount: 8}

  - rank: 5
    title: Lantern Night
    look: >-
      [DRAFT] The fifteenth night, and the city is lit end to end. {night-markets:night market roars:night markets roar}, and a rabbit lantern bobs above the crowd.
    required: 6
    story: >-
      [DRAFT] The fifteenth night of the first month, and the city is lit end to end. The lantern maker sells her last rabbit lantern. Her brother is in the crowd after all, carrying one she made. She does not call out.
    teaches:
      title: The Lantern Festival
      text: >-
        On the fifteenth night of the new year the capital hung out lanterns by the thousand, and the memoir describes great lantern displays near the palace gate. A few years later the city fell, and Meng Yuanlao wrote it down so that it would be remembered.
      status: DRAFT
      sources: [{source: dmhl, locator: "[VERIFY] the Lantern Festival (juan 6)"}]
    missions:
      - {id: r5-own-wharves, type: own, generator: canal-wharves, amount: 1.2e4}
      - {id: r5-collect, type: collect, amount: 1.0e13}
      - {id: r5-glitch, type: spot_glitch, amount: 4}
      - {id: r5-level-server, type: level_subagent, subagent: tea-house-server, amount: 3}
      - {id: r5-zoom, type: zoom, amount: 30}
      - {id: r5-own-night, type: own, generator: night-markets, amount: 200}
      - {id: r5-own-hawkers, type: own, generator: street-hawkers, amount: 8.0e7}
      - {id: r5-capsules, type: open_capsules, amount: 18}
      - {id: r5-level-any, type: level_subagent, subagent: any, amount: 4}

migrations: []
