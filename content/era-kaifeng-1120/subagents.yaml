# Subagents: ordinary people of the era, never famous figures. They persist through sleep. ALL DRAFT.
#   rarity:  common | rare | legendary (legendary is event-only)
#   effect:  automate (generator, speed_per_level) | multiply (scope: era, per_level) | bonus_chance (per_level)
#   level_cost: Clarity = clarity_base * clarity_growth^(level-1); cards = cards_base * 2^(level-2) from level 2
#   pages:   one life page per level, revealed on reaching it. Each needs sources before it can be VERIFIED.

level_cost:
  clarity_base: 40
  clarity_growth: 1.8
  cards_base: 1

subagents:
