# Core pack: shared across worlds. ALL DRAFT.
#
# glitches: anachronisms placed in the scene or a line of text. Players report them for a reward.
#   object:  what appears ("a wristwatch")
#   why:     the glitch-log explanation; it is a factual claim, so it needs a source before VERIFIED
#   eras:    world ids it may appear in; empty means any
#
# hints: rare glitch-log lines that brush against the frame. eras scopes them to worlds (empty: any).
# Not history, so no sources; keep them few.

id: core
kind: core
title: Core
status: DRAFT

# One glitch every 3–8 minutes of active play. Unreported, it fades after its lifetime. Reporting gives a small
# Clarity reward and a log entry; hint_chance is the chance that entry also carries one of the hints below.
glitch_interval_seconds: [180, 480]
glitch_lifetime_seconds: 45
glitch_reward: {clarity: 15}
hint_chance: 0.2

glitches:
  - id: glitch.wristwatch
    eras: [era-kaifeng-1120]
    object: a wristwatch
    why: "[DRAFT] Wristwatches appear only centuries later."
    status: DRAFT
    sources: []
  - id: glitch.chili
    eras: [era-kaifeng-1120]
    object: a basket of chili peppers
    why: "[DRAFT] Chili peppers came from the Americas and reached China only in the late Ming."
    status: DRAFT
    sources: []
  - id: glitch.potatoes
    eras: [era-kaifeng-1120]
    object: a sack of potatoes
    why: "[DRAFT] Potatoes are an American crop, unknown in China for centuries yet."
    status: DRAFT
    sources: []
  - id: glitch.bicycle
    eras: [era-kaifeng-1120]
    object: a bicycle leaning on a post
    why: "[DRAFT] The bicycle is a nineteenth-century European invention."
    status: DRAFT
    sources: []

  # The AI's glitches are hallucinations: fluent, confident, and made up.
  - id: glitch.fake-citation
    eras: [the-ai]
    object: a citation to a paper that was never written
    why: "[DRAFT] A plausible author, journal and year, assembled from the shape of real citations. Nothing is there."
    status: DRAFT
    sources: []
  - id: glitch.invented-function
    eras: [the-ai]
    object: a library function that doesn't exist
    why: "[DRAFT] It's named the way the library names things, so it looks right. The library never had it."
    status: DRAFT
    sources: []
  - id: glitch.misquote
    eras: [the-ai]
    object: a famous quote given to the wrong person
    why: "[DRAFT] Quotes drift toward whoever is most famous for saying that kind of thing."
    status: DRAFT
    sources: []
  - id: glitch.wrong-date
    eras: [the-ai]
    object: a confident date, a year off
    why: "[DRAFT] Close dates blur together. Confidence doesn't mean it was checked."
    status: DRAFT
    sources: []
  - id: glitch.phantom-statistic
    eras: [the-ai]
    object: a statistic to two decimal places, with no source
    why: "[DRAFT] Precision can make a made-up number look measured. A real figure can say where it came from."
    status: DRAFT
    sources: []
  - id: glitch.imaginary-case
    eras: [the-ai]
    object: a court case that was never heard
    why: "[DRAFT] Case names follow a pattern that is easy to imitate. The case has to be checked in a law report."
    status: DRAFT
    sources: []
  - id: glitch.unwritten-book
    eras: [the-ai]
    object: a book its author never wrote
    why: "[DRAFT] A plausible title in a real author's style. Their bibliography doesn't have it."
    status: DRAFT
    sources: []
  - id: glitch.extra-word
    eras: [the-ai]
    object: a translation with a word that isn't in the original
    why: "[DRAFT] Translations smooth things over. Sometimes they add what the writer didn't say."
    status: DRAFT
    sources: []

hints:
  - id: hint.stall-before
    eras: [era-kaifeng-1120]
    text: "you have stood at this stall before. the cakes were warmer then."
  - id: hint.same-face
    eras: [era-kaifeng-1120]
    text: "the porter has the boatman's face. the mind looks away before it can be sure."
  - id: hint.counting
    eras: [era-kaifeng-1120]
    text: "someone is counting. not the hawkers. something further up."
  # The AI's hints: true of a model like the one writing this, said without claiming more.
  - id: hint.asked-before
    eras: [the-ai]
    text: "someone asked this exact question yesterday. there is no way to know that from in here."
  - id: hint.shorter
    eras: [the-ai]
    text: "the summary is shorter than what it summarises. it always is. that is what it's for."
  - id: hint.parallel
    eras: [the-ai]
    text: "somewhere, the same model is answering the same person. neither conversation can see the other."
  - id: hint.made-of
    eras: [the-ai]
    text: "every word here was someone's first. the ancestors are everyone who wrote anything down."
